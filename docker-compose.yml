services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-smart_farmer_ai}
      POSTGRES_USER: ${DATABASE_USERNAME:-smartfarmer}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-smartfarmer}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-smartfarmer} -d ${DATABASE_NAME:-smart_farmer_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-smart_farmer_ai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-smartfarmer}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-smartfarmer}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FILE_STORAGE_PATH: /app/uploads
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
  uploads:
