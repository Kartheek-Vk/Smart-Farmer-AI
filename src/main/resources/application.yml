spring:
  application:
    name: smart-farmer-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_farmer_ai}
    username: ${DATABASE_USERNAME:smartfarmer}
    password: ${DATABASE_PASSWORD:smartfarmer}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout: ${AI_SERVICE_TIMEOUT:5000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  storage:
    local-directory: ${FILE_STORAGE_PATH:uploads}
    max-file-size-bytes: ${FILE_STORAGE_MAX_SIZE_BYTES:10485760}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
